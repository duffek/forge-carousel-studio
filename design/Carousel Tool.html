<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoundersForge · Carousel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.5/dist/index.js"></script>
<style>
  :root{
    --grad-start:#FF6B2B; --grad-end:#F5A623; --italic-orange:#F08030;
    --bg:#0a0a0c; --panel:#111114; --panel-2:#17171b; --line:rgba(255,255,255,.08);
    --line-2:rgba(255,255,255,.14); --ink:#ececf0; --muted:#8b8b93; --muted-2:#63636b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:var(--italic-orange);text-decoration:none}a:hover{color:var(--grad-start)}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:rgba(255,107,43,.3)}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#26262c;border-radius:6px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:#33333b}

  /* ============ App chrome ============ */
  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141418,#0d0d10)}
  .brand{display:flex;align-items:center;gap:13px}
  .brand img{height:26px;width:auto;display:block}
  .brand .sub{font-family:'Open Sans';font-weight:600;font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;padding-left:13px;border-left:1px solid var(--line)}
  .topbar .sep{width:1px;height:24px;background:var(--line)}
  .topbar .crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .topbar .crumb b{color:var(--ink);font-weight:600}
  .topbar .spacer{flex:1}
  .topbar .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted-2);letter-spacing:.04em}

  /* Buttons */
  .btn{font-family:'Open Sans';font-weight:600;font-size:13px;letter-spacing:.01em;background:var(--panel-2);color:var(--ink);border:1px solid var(--line-2);padding:9px 15px;border-radius:8px;transition:.15s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .btn:hover{background:#202026;border-color:#33333c}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.primary{background:linear-gradient(160deg,var(--grad-start),var(--grad-end));color:#120a04;border:none;font-weight:700}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent;border-color:var(--line)}
  .btn.ghost:hover{background:rgba(255,255,255,.04)}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:7px}
  .btn.lg{padding:14px 26px;font-size:15px;border-radius:10px}
  .btn.danger:hover{border-color:#5b2b2b;color:#ff8a8a;background:rgba(120,40,40,.15)}
  .icon-btn{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px}

  .view{flex:1;min-height:0;overflow:auto}

  /* ============ Compose ============ */
  .compose{max-width:860px;margin:0 auto;padding:56px 24px 80px}
  .compose .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--italic-orange);margin-bottom:14px}
  .compose h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:52px;line-height:.98;text-transform:uppercase;letter-spacing:.005em}
  .compose h1 .g{background:linear-gradient(180deg,var(--grad-start),var(--grad-end));-webkit-background-clip:text;background-clip:text;color:transparent}
  .compose .lede{color:var(--muted);font-size:16px;line-height:1.55;margin-top:16px;max-width:620px}
  .card-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:34px}
  .fieldset{margin-bottom:24px}
  .fieldset:last-child{margin-bottom:0}
  .flabel{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .flabel .t{font-weight:700;font-size:14px}
  .flabel .h{font-size:12px;color:var(--muted-2)}
  textarea.input,input.input{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;color:var(--ink);font-family:inherit;font-size:15px;line-height:1.5;padding:14px 15px;resize:vertical;transition:.15s}
  textarea.input:focus,input.input:focus{outline:none;border-color:var(--italic-orange);box-shadow:0 0 0 3px rgba(240,128,48,.12)}
  textarea.input::placeholder,input.input::placeholder{color:var(--muted-2)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:640px){.row{grid-template-columns:1fr}}

  .seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px}
  .seg button{flex:1;background:transparent;border:none;color:var(--muted);font-weight:600;font-size:13px;padding:9px 8px;border-radius:7px;transition:.12s}
  .seg button.on{background:var(--panel-2);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.05)}
  .seg button:hover:not(.on){color:var(--ink)}

  .stepper{display:flex;align-items:center;gap:16px}
  .stepper .num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:40px;min-width:52px;text-align:center;background:linear-gradient(180deg,var(--grad-start),var(--grad-end));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stepper input[type=range]{flex:1}
  input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:4px;background:linear-gradient(90deg,var(--grad-start),var(--grad-end)) 0/var(--fill,50%) no-repeat,#26262c;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--grad-start);box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .hintline{font-size:12.5px;color:var(--muted-2);margin-top:9px;line-height:1.5}
  .gen-status{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:13.5px;color:var(--muted)}
  .compose-actions{display:flex;align-items:center;gap:14px;margin-top:30px}

  /* ============ Lineup ============ */
  .lineup{padding:26px 30px 90px}
  .lineup-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:8px;flex-wrap:wrap}
  .lineup-head .ttl{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:30px;text-transform:uppercase;letter-spacing:.01em;outline:none}
  .lineup-head .ttl:focus{color:#fff}
  .lineup-head .sub{font-size:13px;color:var(--muted);margin-top:3px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 26px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .toolbar .spacer{flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.15s;position:relative}
  .card.drag-over{border-color:var(--italic-orange);box-shadow:0 0 0 3px rgba(240,128,48,.18)}
  .card.dragging{opacity:.4}
  .card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .card .thumb{position:relative;cursor:pointer;background:#000;aspect-ratio:4/5}
  .card .thumb .badge{position:absolute;top:9px;left:9px;z-index:5;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);color:#dcdce2;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
  .card .thumb .go{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s;background:rgba(8,8,10,.55)}
  .card .thumb:hover .go{opacity:1}
  .card .foot{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  .card .foot .lay{font-size:11.5px;color:var(--muted);text-transform:capitalize;flex:1}
  .card .foot .mini{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);transition:.12s}
  .card .foot .mini:hover{color:var(--ink);border-color:var(--line-2)}
  .card.add{display:flex;align-items:center;justify-content:center;min-height:200px;border-style:dashed;border-color:var(--line-2);color:var(--muted);cursor:pointer;font-weight:600;gap:10px;flex-direction:column}
  .card.add:hover{color:var(--ink);border-color:var(--italic-orange);background:rgba(240,128,48,.04)}
  .card.add .plus{font-size:30px;font-weight:300;line-height:1}

  /* ============ Editor ============ */
  .editor{display:flex;flex-direction:column;height:100%}
  .ed-top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  .ed-top .idx{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);letter-spacing:.08em}
  .ed-top .spacer{flex:1}
  .ed-body{flex:1;min-height:0;display:flex}
  .ed-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:auto;background:#3a3a42;background-image:radial-gradient(140% 100% at 50% -10%,#4a4a54,#2f2f37 70%)}
  .stage-slide{height:min(66vh,600px);aspect-ratio:4/5;flex:0 0 auto;box-shadow:0 30px 70px rgba(0,0,0,.55);border-radius:3px;overflow:hidden}
  .stage-slide .slide{border-radius:0}
  .imgbar{display:flex;align-items:stretch;gap:10px;width:min(100%,calc(66vh*0.8));max-width:520px;margin-top:16px}
  .imgbar .prompt{flex:1;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;color:var(--ink);font-family:inherit;font-size:13px;padding:9px 12px;resize:none;line-height:1.4}
  .imgbar .prompt:focus{outline:none;border-color:var(--italic-orange)}
  .imgbar .disabled-note{flex:1;display:flex;align-items:center;font-size:12.5px;color:var(--muted-2);font-style:italic}
  .ed-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(20,20,24,.8);border:1px solid var(--line-2);color:var(--ink);font-size:20px;display:flex;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(6px)}
  .ed-nav:hover{background:var(--panel-2);border-color:var(--italic-orange)}
  .ed-nav.prev{left:18px}.ed-nav.next{right:18px}
  .ed-nav:disabled{opacity:.3}

  /* Inspector */
  .inspector{width:330px;flex:0 0 330px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:20px}
  .insp-sec{margin-bottom:22px}
  .insp-sec>.h{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2);margin-bottom:11px}
  .insp-field{margin-bottom:13px}
  .insp-field>label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .insp-field textarea,.insp-field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:inherit;font-size:13.5px;padding:9px 11px;resize:vertical;line-height:1.45}
  .insp-field textarea:focus,.insp-field input:focus{outline:none;border-color:var(--italic-orange)}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .chips button{background:var(--bg);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:12.5px;padding:9px;border-radius:8px;text-transform:capitalize}
  .chips button.on{border-color:var(--italic-orange);color:var(--ink);background:rgba(240,128,48,.08)}
  .insp-actions{display:flex;gap:8px;flex-wrap:wrap}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink)}
  .switch{width:42px;height:24px;border-radius:14px;background:#2a2a31;border:1px solid var(--line);position:relative;transition:.15s;flex:0 0 auto}
  .switch.on{background:linear-gradient(90deg,var(--grad-start),var(--grad-end));border-color:transparent}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on::after{left:20px}

  /* Thumbnail rail */
  .rail{flex:0 0 auto;display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel);overflow-x:auto}
  .rail .rthumb{flex:0 0 auto;width:66px;aspect-ratio:4/5;border-radius:5px;overflow:hidden;border:2px solid transparent;cursor:pointer;position:relative;background:#000}
  .rail .rthumb.on{border-color:var(--italic-orange)}
  .rail .rthumb .n{position:absolute;bottom:2px;right:3px;z-index:5;font-family:'JetBrains Mono',monospace;font-size:8px;color:#fff;background:rgba(0,0,0,.6);padding:1px 3px;border-radius:3px}
  .rail-add{flex:0 0 auto;width:66px;aspect-ratio:4/5;border-radius:5px;border:2px dashed var(--line-2);background:transparent;color:var(--muted);font-size:22px;font-weight:300}
  .rail-add:hover{color:var(--ink);border-color:var(--italic-orange)}

  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--italic-orange);animation:spin .7s linear infinite;flex:0 0 auto}
  .spinner.dark{border-color:rgba(0,0,0,.25);border-top-color:#120a04}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{background:rgba(120,40,40,.15);border:1px solid #5b2b2b;color:#ffb3b3;font-size:13px;padding:11px 14px;border-radius:9px;margin-top:16px}

  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:16px;text-align:center;padding:40px}

  /* ============ SLIDE RENDER SYSTEM (4:5, container-scaled) ============ */
  .slide{width:100%;height:100%;background:#000;position:relative;overflow:hidden;container-type:inline-size;font-family:'Open Sans',sans-serif;color:#fff}
  .slide{--hscale:1;--bscale:1}
  .slide .body{font-family:'Open Sans',sans-serif;color:#fff;font-weight:500;font-size:calc(4.2cqw*var(--bscale));line-height:1.28;letter-spacing:-.005em;white-space:pre-line}
  .slide .body.small{font-size:calc(3.6cqw*var(--bscale))}
  .slide .body .em{font-style:italic;color:var(--italic-orange);font-weight:500}
  .slide .kicker{font-size:calc(4cqw*var(--bscale));font-weight:500;color:#fff;white-space:pre-line}
  .slide .accent{font-family:'Barlow Condensed',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.005em;line-height:.95;background:linear-gradient(180deg,var(--grad-start) 0%,var(--grad-end) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:calc(9.2cqw*var(--hscale));white-space:pre-line}
  .slide .accent.xl{font-size:calc(11.4cqw*var(--hscale));line-height:.92}
  .slide .accent.xxl{font-size:calc(14cqw*var(--hscale));line-height:.9}
  .slide .accent.md{font-size:calc(7.6cqw*var(--hscale));line-height:.98}
  .slide [contenteditable]{outline:none}
  .slide [contenteditable]:hover{box-shadow:inset 0 0 0 1px rgba(255,107,43,.3)}
  .slide [contenteditable]:focus{box-shadow:inset 0 0 0 1px rgba(255,107,43,.85);background:rgba(255,107,43,.05)}
  .slide [contenteditable][data-ph]:empty:before{content:attr(data-ph);color:rgba(255,255,255,.32);font-style:italic}

  .slide .wordmark{position:absolute;left:5.5cqw;bottom:4.2cqw;font-family:'Barlow Condensed',sans-serif;font-weight:900;color:#fff;font-size:3.4cqw;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:.9cqw;z-index:4}
  .slide .wordmark .dot{width:1.6cqw;height:1.6cqw;background:linear-gradient(180deg,var(--grad-start),var(--grad-end));border-radius:50%}
  .slide .wordmark-logo{position:absolute;left:5.5cqw;bottom:4.2cqw;height:5cqw;width:auto;z-index:4}
  .slide .swipe{position:absolute;left:5.5cqw;bottom:4.2cqw;font-family:'Open Sans',sans-serif;font-weight:600;color:var(--italic-orange);font-size:3.4cqw;display:flex;align-items:center;gap:1.2cqw;letter-spacing:.01em;z-index:4}
  .slide .swipe .arrow{width:5.6cqw;height:5cqw;display:block}
  .slide .counter{position:absolute;right:4.5cqw;top:4cqw;font-family:'JetBrains Mono',monospace;font-size:2.1cqw;letter-spacing:.2em;color:rgba(255,255,255,.4);text-transform:uppercase;z-index:4}
  .slide .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);margin:3cqw 0}

  .slide .pad{padding:6.5cqw 6cqw}
  .slide .stack{display:flex;flex-direction:column;gap:4.4cqw}
  .slide .stack.tight{gap:3cqw}
  .slide .cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:6.5cqw 6cqw 12cqw}
  .slide .cover .inner{position:relative;z-index:2;display:flex;flex-direction:column;gap:2.4cqw}
  .slide .photo{position:absolute;inset:0;z-index:0}
  .slide .cover .photo::after,.slide .closer .photo::after{content:"";position:absolute;inset:0;z-index:1}
  .slide .cover .photo::after{background:linear-gradient(180deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.32) 52%,rgba(0,0,0,.78) 100%)}
  .slide .closer .photo::after{background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,.55) 45%,rgba(0,0,0,.9))}
  .slide .beat{position:absolute;inset:0;padding:8cqw 6cqw;display:flex;flex-direction:column;justify-content:center;gap:4.5cqw}
  .slide .composite{position:absolute;inset:0;display:flex;flex-direction:column}
  .slide .composite .top{padding:6.5cqw 6cqw 4cqw;flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-start;gap:3.4cqw}
  .slide .composite .photo{position:relative;height:44%;flex:0 0 44%;overflow:hidden}
  .slide .composite .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,0) 35%);z-index:1}

  .slide .bullets{display:flex;flex-direction:column;gap:2.6cqw;margin-top:1cqw}
  .slide .bullets .brow{display:flex;gap:3cqw;align-items:flex-start;font-family:'Open Sans',sans-serif;font-weight:600;color:#fff;font-size:3.9cqw;line-height:1.25}
  .slide .bullets .brow::before{content:"";flex:0 0 auto;width:2.2cqw;height:2.2cqw;margin-top:1.5cqw;background:var(--italic-orange);border-radius:50%}

  /* image / placeholder */
  .slide .user-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .slide .ph{position:absolute;inset:0;background:#111;overflow:hidden;z-index:0}
  .slide .ph .stripes{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 22px),radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.08),transparent 60%),linear-gradient(180deg,var(--ph-a,#2a2420) 0%,var(--ph-b,#0e0c0b) 100%);filter:saturate(.55) contrast(1.05)}
  .slide .ph .grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay;background-image:radial-gradient(rgba(255,255,255,.25) 1px,transparent 1px);background-size:3px 3px}
  .slide .ph .plabel{position:absolute;left:4cqw;right:4cqw;top:50%;transform:translateY(-50%);font-family:'JetBrains Mono',monospace;font-size:2.2cqw;color:rgba(255,255,255,.5);letter-spacing:.02em;line-height:1.5;text-align:center}
  .slide .ph .pcorner{position:absolute;top:3.5cqw;left:3.5cqw;font-family:'JetBrains Mono',monospace;font-size:1.9cqw;letter-spacing:.2em;color:rgba(255,255,255,.4);text-transform:uppercase}
  .slide .ph .frame{position:absolute;inset:3.5cqw;border:1px solid rgba(255,255,255,.1)}
</style>
</head>
<body>
<div id="root"></div>
